name: Build debug APK

# Push to main -> a debug APK as a workflow artifact.
# The app embeds sing-box's libbox, which is NOT stored in this repo (binary,
# 28.6 MB). CI rebuilds it from the official sing-box tag using the exact
# recipe proven in autoconnect-core/research/PROOF.md, with every tool pinned
# by autoconnect-core/research/CORE_VERSION. sing-box source is never patched.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go 1.25.5
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android NDK 28.0.13004108
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.13004108"

      - name: Build libbox.aar from the official sing-box v1.14.4 tag
        run: |
          git clone --depth 1 --branch v1.14.4 https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          test "$(git describe --tags)" = "v1.14.4"
          export PATH="$PATH:$(go env GOPATH)/bin"
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          go run ./cmd/internal/build_libbox -target android -platform android/arm64
          ls -la libbox.aar
          sha256sum libbox.aar
          echo "08ea27a3a33349d1f17ba59d447b20c5167c8895d25eb479ab81b2e43e6361fe  libbox.aar" | sha256sum -c -
          mkdir -p "$GITHUB_WORKSPACE/autoconnect-app/libs"
          cp libbox.aar "$GITHUB_WORKSPACE/autoconnect-app/libs/libbox.aar"

      - name: Build the debug APK
        working-directory: autoconnect-app
        run: gradle assembleDebug --stacktrace

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoConnect-debug-apk
          path: autoconnect-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
